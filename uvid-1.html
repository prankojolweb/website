<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KUMPULAN VIDEO VIRAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    .profile {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 45px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.15;
      margin: 0 0 55px;
      font-weight: 800;
    }

    .video-list {
      text-align: left;
      margin: 0 auto;
      max-width: 400px;
    }

    .video-item {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 0 0 25px;
      text-decoration: none;
      color: #326b9d;
      font-size: 28px;
    }

    .play {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 50%;
      background: #20cc6b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 25px;
    }

    .link-button {
      display: inline-block;
      margin-top: 25px;
      padding: 18px 38px;
      background: #20cc6b;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 24px;
      font-weight: bold;
    }

    .info {
      margin-top: 55px;
      font-size: 18px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      .profile {
        width: 180px;
        height: 180px;
        margin-bottom: 45px;
      }

      h1 {
        font-size: 40px;
      }

      .video-item {
        font-size: 26px;
      }
    }
  </style>
</head>
