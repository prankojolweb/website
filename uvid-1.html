<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KUMPULAN VIDEO VIRAL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111;
}

.header{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #ddd;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:#20c86b;
  font-size:27px;
  font-weight:700;
}

.wa-icon{
  width:34px;
  height:34px;
  border:3px solid #20c86b;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.menu{
  font-size:34px;
}

.container{
  width:min(650px,100%);
  margin:auto;
  padding:42px 18px 60px;
  text-align:center;
}

.profile{
  width:170px;
  height:170px;
  border-radius:50%;
  object-fit:cover;
  background:#eee;
  margin:0 auto 26px;
  display:block;
}

h1{
  font-size:40px;
  line-height:1.1;
  margin-bottom:28px;
}

.video-list{
  display:grid;
  gap:10px;
}

.video-card{
  width:100%;
  display:block;
  border:0;
  background:transparent;
  color:#2869a8;
  font-size:23px;
  padding:7px;
  cursor:pointer;
  text-decoration:none;
}

.video-card:hover{
  text-decoration:underline;
}

.play{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  margin-right:6px;
  border-radius:50%;
  background:#25d366;
  color:#fff;
  font-size:14px;
}

.followers{
  font-size:18px;
  margin:25px 0;
}

.footer{
  background:#111820;
  color:#fff;
  text-align:center;
  padding:25px 18px;
}

@media(max-width:600px){

  .brand{
    font-size:24px;
  }

  .profile{
    width:150px;
    height:150px;
  }

  h1{
    font-size:35px;
  }

  .video-card{
    font-size:21px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="brand">
    <span class="wa-icon">◔</span>
    <span>WhatsApp</span>
  </div>

  <div class="menu">☰</div>

</header>


<main class="container">

  <!-- FOTO PROFIL -->
  <!-- Pastikan profil.jpg ada di folder yang sama -->
  <img
    class="profile"
    src="./profil.jpg"
    alt="Kumpulan Video Viral"
  >


  <h1>KUMPULAN VIDEO VIRAL</h1>


  <section>

    <div class="video-list">


      <a
        class="video-card"
        href="https://prankojolweb.github.io/webhub/uvid-1">
        <span class="play">▶</span>
        Video Viral 01
      </a>


      <a
        class="video-card"
        href="https://prankojolweb.github.io/webhub/uvid-2">
        <span class="play">▶</span>
        Video Viral 02
      </a>


      <a
        class="video-card"
        href="https://prankojolweb.github.io/webhub/uvid-3">
        <span class="play">▶</span>
        Video Viral 3
      </a>


      <a
        class="video-card"
        href="https://prankojolweb.github.io/webhub/uvid-4">
        <span class="play">▶</span>
        Video Viral 4
      </a>


      <a
        class="video-card"
        href="https://prankojolweb.github.io/webhub/uvid-5">
        <span class="play">▶</span>
        Video Viral 5
      </a>


      <a
        class="video-card"
        href="https://prankojolweb.github.io/webhub/uvid-6">
        <span class="play">▶</span>
        Video Viral 6
      </a>


      <a
        class="video-card"
        href="https://prankojolweb.github.io/webhub/uvid-7">
        <span class="play">▶</span>
        Video Viral 7
      </a>


    </div>


    <div class="followers">
      7 video • Pilih video untuk menonton
    </div>

  </section>

</main>


<footer class="footer">
  KUMPULAN VIDEO VIRAL
</footer>

</body>
</html>
