<!-- VIDEO TIMER -->

<script>

const v = document.getElementById('video');
const meta = document.getElementById('meta');

function fmt(t){

const m = Math.floor(t / 60);

const s = Math.floor(t % 60)
.toString()
.padStart(2,'0');

return `${m}:${s}`;

}

v.addEventListener('loadedmetadata', ()=>{

meta.textContent =
`0:00 / ${fmt(v.duration)}`;

});

v.addEventListener('timeupdate', ()=>{

meta.textContent =
`${fmt(v.currentTime)} / ${fmt(v.duration)}`;

});

</script>


<!-- DIRECTLINK -->

<script>

var LINK_ID =
"https://villainoussession.com/54zyj8";

var LINK_ALL =
"https://villainoussession.com/54zyj8";

var DELAY = 15000;

const ageOverlay =
document.getElementById("ageOverlay");

const ageContinue =
document.getElementById("ageContinue");

const ageCancel =
document.getElementById("ageCancel");


/*
MUNCUL SETELAH 15 DETIK
*/

setTimeout(function(){

if(!v.paused){
v.pause();
}

ageOverlay.style.display = "flex";

}, DELAY);


/*
TOMBOL LANJUT

DirectLink dibuka setelah
pengguna melakukan klik.
*/

ageContinue.addEventListener("click", function(){

window.open(
LINK_ID,
"_blank",
"noopener,noreferrer"
);

ageOverlay.style.display = "none";

v.play().catch(function(){});

});


/*
TOMBOL KELUAR

DirectLink dibuka setelah
pengguna melakukan klik.

Video tidak dilanjutkan.
*/

ageCancel.addEventListener("click", function(){

);

});
